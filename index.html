<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="India Mathematics AR - CBSE Class 6 educational WebAR experience with MindAR image tracking." />
  <title>India Mathematics AR</title>

  <link rel="stylesheet" href="./style.css" />

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <div id="loading-screen" class="loading-screen" aria-live="polite" aria-busy="true">
    <div class="loading-panel">
      <div class="app-title">India Mathematics AR</div>
      <div class="loading-subtitle">Preparing camera and image tracking</div>
      <div class="progress-track" aria-hidden="true">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div id="progress-text" class="progress-text">Loading 0%</div>
      <div id="loading-hint" class="loading-hint">Please allow camera access when prompted.</div>
    </div>
  </div>

  <div id="status-overlay" class="status-overlay" aria-live="polite">
    <div id="status-badge" class="status-badge">Starting camera...</div>
  </div>

  <div id="label-layer" class="label-layer" aria-hidden="true">
    <div id="label1" class="ar-label label-1">🔺 TRIANGLES</div>
    <div id="line1" class="leader-line line-1"></div>

    <div id="label2" class="ar-label label-2">📐 GEOMETRY</div>
    <div id="line2" class="leader-line line-2"></div>

    <div id="label3" class="ar-label label-3">⚖ SYMMETRY</div>
    <div id="line3" class="leader-line line-3"></div>

    <div id="label4" class="ar-label label-4">🏛 ANCIENT INDIAN ARCHITECTURE</div>
  </div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 8"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true; precision: mediump; logarithmicDepthBuffer: false"
    background="color: black"
    embedded
  >
    <a-assets timeout="10000">
      <a-asset-item id="templeModel" src="./assets/temple.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; color: #ffffff; intensity: 1.15"></a-entity>
    <a-entity light="type: directional; color: #fff4d6; intensity: 2.6; castShadow: true" position="1.5 3 2"></a-entity>
    <a-entity light="type: directional; color: #ffd36b; intensity: 1.2" position="-2 2 1"></a-entity>

    <a-camera
      id="camera"
      position="0 0 0"
      look-controls="enabled: false"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable"
    ></a-camera>

    <a-entity id="anchor" mindar-image-target="targetIndex: 0">
      <a-entity
        id="templeRig"
        position="0 -0.16 0"
        rotation="0 0 0"
        scale="0.01 0.01 0.01"
      >
        <a-entity
          id="templeWrap"
          gltf-model="#templeModel"
          position="0 0 0"
          rotation="0 180 0"
          shadow="cast: true; receive: true"
          class="clickable"
        ></a-entity>

        <a-entity
          id="goldGlow"
          geometry="primitive: sphere; radius: 0.42"
          material="color: #f9d66b; emissive: #f5c542; emissiveIntensity: 1.8; transparent: true; opacity: 0.18; shader: standard"
          position="0 0.95 0"
        ></a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script src="./main.js"></script>
</body>
</html>
