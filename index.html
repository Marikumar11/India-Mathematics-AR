<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>India Mathematics AR</title>
  
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-aframe.prod.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading-overlay">
    <div class="loader-container">
      <div class="loader-spinner"></div>
      <div class="loader-text">India Mathematics AR</div>
      <div class="loader-subtext" id="status-text">Initializing...</div>
      <div class="loader-progress" id="progress-bar"><span style="width:0%"></span></div>
    </div>
  </div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./assets/targets.mind;"
    renderer="antialias: true; alpha: false;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity id="temple-group" position="0 0 0">
        <a-gltf-model
          id="temple-model"
          src="./assets/temple.glb"
          scale="0.8 0.8 0.8"
          position="0 0 0"
          rotation="0 0 0"
        ></a-gltf-model>

        <!-- Label 1 -->
        <a-entity id="label1" class="label-entity" visible="false">
          <a-entity position="0 1.2 0.3">
            <a-entity text="value: 🔺 TRIANGLES; color: #FFD700; align: center; font: exo2bold; width: 2;"
              position="0 0.3 0"></a-entity>
            <a-entity line="start: 0 0 0; end: 0 -0.6 0; color: #FFD700; opacity: 0.8"></a-entity>
            <a-sphere position="0 -0.6 0" radius="0.04" color="#FFD700"></a-sphere>
          </a-entity>
        </a-entity>

        <!-- Label 2 -->
        <a-entity id="label2" class="label-entity" visible="false">
          <a-entity position="0.6 0.5 0.3">
            <a-entity text="value: 📐 GEOMETRY; color: #4CAF50; align: center; font: exo2bold; width: 1.8;"
              position="0 0.3 0"></a-entity>
            <a-entity line="start: 0 0 0; end: -0.4 -0.2 0; color: #4CAF50; opacity: 0.8"></a-entity>
            <a-sphere position="-0.4 -0.2 0" radius="0.04" color="#4CAF50"></a-sphere>
          </a-entity>
        </a-entity>

        <!-- Label 3 -->
        <a-entity id="label3" class="label-entity" visible="false">
          <a-entity position="-0.5 0.0 0.3">
            <a-entity text="value: ⚖ SYMMETRY; color: #00BCD4; align: center; font: exo2bold; width: 1.8;"
              position="0 0.3 0"></a-entity>
            <a-entity line="start: 0 0 0; end: 0.3 -0.1 0; color: #00BCD4; opacity: 0.8"></a-entity>
            <a-sphere position="0.3 -0.1 0" radius="0.04" color="#00BCD4"></a-sphere>
          </a-entity>
        </a-entity>

        <!-- Label 4 -->
        <a-entity id="label4" class="label-entity" visible="false">
          <a-entity position="0 -0.9 0.3">
            <a-entity text="value: 🏛 ANCIENT INDIAN ARCHITECTURE; color: #FF9800; align: center; font: exo2bold; width: 2.5;"
              position="0 0 0"></a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-entity light="type: ambient; color: #404060; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; color: #FFEEDD; intensity: 1.2; castShadow: true;"
      position="1 3 2"></a-entity>
    <a-entity light="type: directional; color: #CCDDFF; intensity: 0.5;"
      position="-2 1 -1"></a-entity>
    <a-entity light="type: point; color: #FFAA33; intensity: 0.8; distance: 4; decay: 1;"
      position="0 1.2 0.8"></a-entity>
  </a-scene>

  <script src="main.js"></script>
</body>
</html>
